name: Compact landing browser gate
on:
  pull_request:
    paths:
      - 'hosted/**'
      - 'src/**'
      - '.github/workflows/compact-landing-qa.yml'
  push:
    branches: [main]
    paths:
      - 'hosted/**'
      - 'src/**'
      - '.github/workflows/compact-landing-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install browser tester in CI only
        run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
      - name: Install Chromium in CI only
        run: npx playwright install --with-deps chromium
      - name: Measure actual first screen and verify interactions
        run: |
          node hosted/scripts/qa-compact-landing.mjs
          node hosted/scripts/qa-commerce-kit.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: compact-landing-qa
          path: qa-screenshots/
          if-no-files-found: ignore
          retention-days: 7
